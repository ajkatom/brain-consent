<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<!--
  brain OAuth consent page (design §6.4). Static; served from a SEPARATE PUBLIC repo on GitHub
  Pages (or Cloudflare Pages). It holds only the project URL and the publishable key: edit the two
  brain-* meta tags below AND the connect-src entry of the Content-Security-Policy to your project
  URL. Do not edit the script or style blocks: their sha256 hashes are pinned in the policy (see
  README.md to recompute them after a deliberate change).
  Tokens live in memory only (no localStorage, no cookies). See README.md for which Supabase Auth
  endpoints are verified and which are not.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-+SY7ERMKB5NmprxzXNen3+qC2bhdrtzBoKGO0+wiG1M='; style-src 'sha256-x/oyfxJ+2lkGhmXxaEDxf7PPNlPB45vIjUojzu8+QKs='; connect-src https://znmpucfeifpscunuatkl.supabase.co; img-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="brain-supabase-url" content="https://znmpucfeifpscunuatkl.supabase.co">
<meta name="brain-publishable-key" content="sb_publishable_kKiwnmTmgK5uMRNzuBSMKg_AqEwzhIp">
<title>brain authorization</title>
<style>
:root { --bg: #fafafa; --fg: #1b1b1b; --muted: #5f5f5f; --line: #d9d9d9; --accent: #1f5fbf; --danger: #a32020; --panel: #ffffff; }
@media (prefers-color-scheme: dark) { :root { --bg: #151515; --fg: #ececec; --muted: #a8a8a8; --line: #3a3a3a; --accent: #7fb0ff; --danger: #ff8a8a; --panel: #1f1f1f; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 28rem; margin: 3rem auto; padding: 0 16px; }
h1 { font-size: 1.3rem; margin: 0 0 1rem; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
label { display: block; margin: .6rem 0 .2rem; color: var(--muted); font-size: .9rem; }
input { width: 100%; padding: .55rem; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
button { font: inherit; padding: .55rem 1rem; margin-top: 1rem; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
dl { margin: 0; }
dt { color: var(--muted); font-size: .85rem; margin-top: .6rem; }
dd { margin: 0; overflow-wrap: anywhere; }
#status { min-height: 1.5rem; color: var(--muted); }
#status.error { color: var(--danger); }
.row { display: flex; gap: .75rem; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Authorize an app to use your brain</h1>
  <p id="status" role="status">Loading…</p>

  <form id="signin" class="panel" hidden>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit">Sign in</button>
  </form>

  <form id="totp" class="panel" hidden>
    <label for="code">Authenticator code</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    <button class="primary" type="submit">Verify</button>
  </form>

  <section id="consent" class="panel" hidden>
    <dl>
      <dt>App</dt><dd id="client-name"></dd>
      <dt>Client id</dt><dd id="client-id"></dd>
      <dt>Returns to</dt><dd id="redirect"></dd>
      <dt>Access requested</dt><dd id="scopes"></dd>
      <dt>Signed in as</dt><dd id="user"></dd>
    </dl>
    <div class="row">
      <button id="approve" class="primary" type="button">Approve</button>
      <button id="deny" type="button">Deny</button>
    </div>
  </section>
</main>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const meta = (name) => { const m = document.querySelector(`meta[name="${name}"]`); return m ? m.content.trim() : ''; };
  const BASE = meta('brain-supabase-url').replace(/\/+$/, '');
  const KEY = meta('brain-publishable-key');
  const authorizationId = new URLSearchParams(window.location.search).get('authorization_id');
  let session = null; // {access_token, ...}: memory only
  let factorId = null;
  let details = null;

  function say(text, isError) {
    $('status').textContent = text;
    $('status').className = isError ? 'error' : '';
  }
  function only(id) {
    for (const p of ['signin', 'totp', 'consent']) $(p).hidden = p !== id;
  }
  function fail(text) {
    only(null);
    say(text, true);
  }

  if (window.top !== window.self) return fail('Refusing to run inside a frame.');
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(BASE) || !/^sb_publishable_[A-Za-z0-9_-]+$/.test(KEY) || /REPLACE/.test(KEY)) {
    return fail('This page is not configured (project URL and publishable key).');
  }
  if (!authorizationId || !/^[A-Za-z0-9_-]{8,200}$/.test(authorizationId)) {
    return fail('No authorization request. Start the connection from the app you want to connect.');
  }

  async function api(path, { method = 'GET', body, token } = {}) {
    const headers = { apikey: KEY, accept: 'application/json' };
    if (body !== undefined) headers['content-type'] = 'application/json';
    if (token) headers.authorization = `Bearer ${token}`;
    const res = await fetch(`${BASE}/auth/v1${path}`, {
      method, headers, body: body === undefined ? undefined : JSON.stringify(body),
      credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', redirect: 'error',
    });
    let data = null;
    try { data = await res.json(); } catch { data = null; }
    if (!res.ok) {
      const msg = data && (data.msg || data.message || data.error_description || data.error);
      throw new Error(typeof msg === 'string' ? msg.slice(0, 200) : `request failed (${res.status})`);
    }
    return data;
  }

  function jwtClaims(jwt) {
    try {
      const part = String(jwt).split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      return JSON.parse(atob(part + '='.repeat((4 - (part.length % 4)) % 4)));
    } catch { return {}; }
  }

  function busy(form, on) {
    for (const b of form.querySelectorAll('button')) b.disabled = on;
  }

  // 1. Password
  $('signin').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    busy($('signin'), true);
    say('Signing in…');
    try {
      session = await api('/token?grant_type=password', { method: 'POST', body: { email: $('email').value.trim(), password: $('password').value } });
      $('password').value = '';
      const user = await api('/user', { token: session.access_token });
      const totp = (user.factors || []).filter((f) => f.factor_type === 'totp' && f.status === 'verified');
      if (totp.length === 0) return fail('This account has no verified TOTP factor; this page requires one.');
      factorId = totp[0].id;
      only('totp');
      say('Enter the code from your authenticator app.');
      $('code').focus();
    } catch (err) {
      session = null;
      say(`Sign-in failed: ${err.message}`, true);
    } finally {
      busy($('signin'), false);
    }
  });

  // 2. TOTP (the session must reach aal2 before anything is shown)
  $('totp').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    busy($('totp'), true);
    say('Verifying…');
    try {
      const challenge = await api(`/factors/${encodeURIComponent(factorId)}/challenge`, { method: 'POST', token: session.access_token, body: {} });
      const verified = await api(`/factors/${encodeURIComponent(factorId)}/verify`, {
        method: 'POST', token: session.access_token, body: { challenge_id: challenge.id, code: $('code').value.trim() },
      });
      $('code').value = '';
      if (!verified || !verified.access_token || jwtClaims(verified.access_token).aal !== 'aal2') throw new Error('the session did not reach aal2');
      session = verified;
      await loadDetails();
    } catch (err) {
      say(`Verification failed: ${err.message}`, true);
    } finally {
      busy($('totp'), false);
    }
  });

  // 3. What is being authorized
  async function loadDetails() {
    say('Loading the request…');
    details = await api(`/oauth/authorizations/${encodeURIComponent(authorizationId)}`, { token: session.access_token });
    if (details && !details.client && typeof details.redirect_url === 'string') return finish(details.redirect_url, null); // already approved earlier [U]
    if (!details || !details.client || typeof details.redirect_uri !== 'string') throw new Error('unexpected authorization details');
    const c = details.client;
    $('client-name').textContent = c.client_name || c.name || '(no name given)';
    $('client-id').textContent = c.client_id || c.id || '(unknown)';
    let host = details.redirect_uri;
    try { host = new URL(details.redirect_uri).origin; } catch { /* shown as is */ }
    $('redirect').textContent = host;
    const scopes = String(details.scope || details.scopes || '').split(/[\s,]+/).filter(Boolean);
    $('scopes').textContent = scopes.length ? scopes.join(', ') : '(none listed)';
    $('user').textContent = (details.user && details.user.email) || jwtClaims(session.access_token).email || '';
    only('consent');
    say('Check the app and the address it returns to, then approve or deny.');
  }

  // 4. Approve or deny
  async function decide(action) {
    busy($('consent'), true);
    say(action === 'approve' ? 'Approving…' : 'Denying…');
    try {
      const r = await api(`/oauth/authorizations/${encodeURIComponent(authorizationId)}/consent`, { method: 'POST', token: session.access_token, body: { action } });
      const url = r && (r.redirect_url || r.redirect_to);
      if (typeof url !== 'string') throw new Error('no redirect in the answer');
      await finish(url, details && details.redirect_uri);
    } catch (err) {
      busy($('consent'), false);
      say(`Failed: ${err.message}`, true);
    }
  }
  $('approve').addEventListener('click', () => decide('approve'));
  $('deny').addEventListener('click', () => decide('deny'));

  // Return to the app, but only to the redirect URI's own origin; end this page's session first.
  async function finish(url, expectedRedirect) {
    let target;
    try { target = new URL(url); } catch { return fail('The redirect address is not valid.'); }
    if (expectedRedirect) {
      let expected = null;
      try { expected = new URL(expectedRedirect); } catch { expected = null; }
      if (!expected || target.origin !== expected.origin) return fail('The redirect does not match the app\'s registered address; stopped.');
    }
    if (target.protocol !== 'https:' && !(target.protocol === 'http:' && /^(localhost|127\.0\.0\.1)$/.test(target.hostname))) {
      return fail('Refusing a non-https redirect.');
    }
    const token = session && session.access_token;
    session = null;
    if (token) { try { await api('/logout?scope=local', { method: 'POST', token }); } catch { /* best effort */ } }
    only(null);
    say('Done. Returning to the app…');
    window.location.replace(target.href);
  }

  only('signin');
  say('Sign in to review this request.');
  $('email').focus();
})();
</script>
</body>
</html>
